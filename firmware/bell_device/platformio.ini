; School bell DEVICE (ESP32-S3) — replaces the PC + BellPlayer in a building.
; Built by .github/workflows/bell_device.yml; flashed from the admin page (Central bell > Bell device hardware).
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi      ; ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM)
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.embed_files = data_embed/x509_crt_bundle.bin
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  adafruit/RTClib@^2.1.4
  h2zero/NimBLE-Arduino@^1.4.3
  adafruit/Adafruit SSD1306@^2.5.12
  adafruit/Adafruit GFX Library@^1.11.10
monitor_speed = 115200
