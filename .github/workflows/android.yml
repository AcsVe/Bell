name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'native/**', 'static/js/**', 'static/css/**', 'templates/display.html', '.github/workflows/android.yml']

permissions:
  contents: write          # publish the APK to the "latest" release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build web bundle and sync Capacitor
        working-directory: mobile
        env:
          BELL_SERVER: ${{ vars.BELL_SERVER }}   # repo variable, e.g. https://school-bell.onrender.com
        run: |
          npm ci
          npm run web
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: school-bell-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to the fixed download link
        if: github.ref == 'refs/heads/main'
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk school-bell.apk
          gh release view apps >/dev/null 2>&1 || gh release create apps --title "تطبيقات جرس الحصص" --notes "آخر نسخة من التطبيقات، تتحدث تلقائياً مع كل بناء."
          gh release upload apps school-bell.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
